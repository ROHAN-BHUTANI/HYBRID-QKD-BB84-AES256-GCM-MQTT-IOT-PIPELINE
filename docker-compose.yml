version: '3.8'

services:
  # Eclipse Mosquitto MQTT Message Broker
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot_mosquitto_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf
    networks:
      - iot-network

  # Hybrid Quantum-Safe IoT Application & Dashboard
  secure-iot-platform:
    build: .
    container_name: secure_iot_platform
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - USE_SIMULATED_BROKER=False
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=5000
    depends_on:
      - mosquitto
    networks:
      - iot-network

networks:
  iot-network:
    driver: bridge
