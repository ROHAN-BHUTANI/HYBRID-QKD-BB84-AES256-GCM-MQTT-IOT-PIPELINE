[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -p no:anyio
norecursedirs = papers_data .git __pycache__ benchmarks database .pytest_cache
markers =
    slow: marks tests as slow (requires real Qiskit BB84 session; deselect with -m "not slow")
